# Local / single-host stack: Web + API + PostgreSQL + persistent volumes.
# Build context is the repository root.  Usage: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "256m"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ZYRQUEN_ENV: development
      ZYRQUEN_DEVELOPMENT_DATABASE_HOST: db
      ZYRQUEN_DEVELOPMENT_DATABASE_PORT: "5432"
      ZYRQUEN_DEVELOPMENT_DATABASE_NAME: ${POSTGRES_DB:?set in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set in .env}
      ZYRQUEN_DATASET_DIR: ${ZYRQUEN_DATASET_DIR:-/data/datasets/current}
      ZYRQUEN_TOKENIZER_PATH: ${ZYRQUEN_TOKENIZER_PATH:-/data/tokenizers/tokenizer.json}
      ZYRQUEN_TRAINING_ROOT: ${ZYRQUEN_TRAINING_ROOT:-/data/training}
      ZYRQUEN_MODEL_REGISTRY_ROOT: ${ZYRQUEN_MODEL_REGISTRY_ROOT:-/data/model-registry}
      ZYRQUEN_TRAINING_ADMIN_EMAILS: ${ZYRQUEN_TRAINING_ADMIN_EMAILS:-}
      ZYRQUEN_ADMIN_USER_IDS: ${ZYRQUEN_ADMIN_USER_IDS:-}
      ZYRQUEN_TRUSTED_PROXY_IPS: ${ZYRQUEN_TRUSTED_PROXY_IPS:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
      - /home/zyrquen
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/livez || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    volumes:
      - datasets:/data/datasets:ro
      - tokenizers:/data/tokenizers:ro
      - training:/data/training
      - model-registry:/data/model-registry

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      ZYRQUEN_API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  pgdata:
  datasets:
  tokenizers:
  training:
  model-registry:

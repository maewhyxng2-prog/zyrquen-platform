# Local / single-host stack: Web + API + PostgreSQL + persistent volumes.
# Build context is the repository root. Usage: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "256m"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}
      ZYRQUEN_ENV: development
      ZYRQUEN_DEVELOPMENT_DATABASE_HOST: db
      ZYRQUEN_DEVELOPMENT_DATABASE_PORT: "5432"
      ZYRQUEN_DEVELOPMENT_DATABASE_NAME: ${POSTGRES_DB:?set in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set in .env}
      ZYRQUEN_APPROVAL_SECRET: ${ZYRQUEN_APPROVAL_SECRET:-}
      ZYRQUEN_DATA_DIR: ${ZYRQUEN_DATA_DIR:-/data/training}
      ZYRQUEN_WORKFLOW_DB_PATH: ${ZYRQUEN_WORKFLOW_DB_PATH:-/data/training/workflow/workflow.db}
      ZYRQUEN_WORKFLOW_SCHEDULER: ${ZYRQUEN_WORKFLOW_SCHEDULER:-1}
      ZYRQUEN_WORKFLOW_RECOVERY: ${ZYRQUEN_WORKFLOW_RECOVERY:-1}
      ZYRQUEN_DATASET_ROOT: ${ZYRQUEN_DATASET_ROOT:-/data/datasets}
      ZYRQUEN_DATASET_DIR: ${ZYRQUEN_DATASET_DIR:-/data/datasets/current}
      ZYRQUEN_TOKENIZER_PATH: ${ZYRQUEN_TOKENIZER_PATH:-/data/tokenizers/tokenizer.json}
      ZYRQUEN_TRAINING_ROOT: ${ZYRQUEN_TRAINING_ROOT:-/data/training}
      ZYRQUEN_MODEL_REGISTRY_ROOT: ${ZYRQUEN_MODEL_REGISTRY_ROOT:-/data/model-registry}
      ZYRQUEN_EVAL_REPORT_PATH: ${ZYRQUEN_EVAL_REPORT_PATH:-}
      ZYRQUEN_TRAINING_ADMIN_EMAILS: ${ZYRQUEN_TRAINING_ADMIN_EMAILS:-}
      ZYRQUEN_ADMIN_USER_IDS: ${ZYRQUEN_ADMIN_USER_IDS:-}
      ZYRQUEN_TRUSTED_PROXY_IPS: ${ZYRQUEN_TRUSTED_PROXY_IPS:-}
      ZYRQUEN_CORS_ALLOW_ORIGINS: ${ZYRQUEN_CORS_ALLOW_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
      - /home/zyrquen
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/livez || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    volumes:
      - datasets:/data/datasets
      - tokenizers:/data/tokenizers:ro
      - training:/data/training
      - model-registry:/data/model-registry

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      ZYRQUEN_API_BASE_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1001,gid=1001,mode=0755
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  native-training:
    profiles: ["training"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.native-training
    environment:
      PYTHON_DOTENV_DISABLED: "1"
    volumes:
      - training:/artifacts
      - model-registry:/data/model-registry
      - datasets:/data/datasets:ro
    read_only: true
    tmpfs:
      - /tmp
      - /home/zyrquen
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

volumes:
  pgdata:
  datasets:
  tokenizers:
  training:
  model-registry:

# Local / single-host stack: Web + API + PostgreSQL + persistent volumes.
# Build context is the repository root.  Usage: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set in .env}
      ZYRQUEN_MODEL_PATH: ${ZYRQUEN_MODEL_PATH:-/data/models/zyrquen-native-v1}
      ZYRQUEN_DATASET_DIR: ${ZYRQUEN_DATASET_DIR:-/data/datasets/current}
      ZYRQUEN_TOKENIZER_PATH: ${ZYRQUEN_TOKENIZER_PATH:-/data/tokenizers/tokenizer.json}
      ZYRQUEN_TRAINING_ROOT: ${ZYRQUEN_TRAINING_ROOT:-/data/training}
      ZYRQUEN_MODEL_REGISTRY_ROOT: ${ZYRQUEN_MODEL_REGISTRY_ROOT:-/data/model-registry}
      ZYRQUEN_TRAINING_ADMIN_EMAILS: ${ZYRQUEN_TRAINING_ADMIN_EMAILS:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - models:/data/models
      - datasets:/data/datasets:ro
      - tokenizers:/data/tokenizers:ro
      - training:/data/training
      - model-registry:/data/model-registry

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      ZYRQUEN_API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
  models:
  datasets:
  tokenizers:
  training:
  model-registry:

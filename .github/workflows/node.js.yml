name: Node.js

on:
  push:
    branches: ["main"]
    paths:
      - "server.ts"
      - "server_fallback.ts"
      - "package.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "src/test/e2e_server.test.ts"
      - "python_core/worker.py"
      - ".github/workflows/node.js.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "server.ts"
      - "server_fallback.ts"
      - "package.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "src/test/e2e_server.test.ts"
      - "python_core/worker.py"
      - ".github/workflows/node.js.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodejs-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-matrix:
    name: Node.js ${{ matrix.node-version }} Backend & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Python for Node-to-Core worker tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run Node.js Backend & Python E2E tests
        run: npx vitest run src/test/e2e_server.test.ts

name: Python application

on:
  push:
    branches: ["main"]
    paths:
      - "apps/api/**"
      - "apps/core/**"
      - "python_core/**"
      - "phases/**"
      - "tests/**"
      - "tests_phases/**"
      - "conftest.py"
      - ".github/workflows/python-app.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/api/**"
      - "apps/core/**"
      - "python_core/**"
      - "phases/**"
      - "tests/**"
      - "tests_phases/**"
      - "conftest.py"
      - ".github/workflows/python-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest-core:
    name: Python Core & Pytest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/python_core
      PYTHON_DOTENV_DISABLED: "1"
      ZYRQUEN_ENV: unit_test
      DATABASE_URL: sqlite:///:memory:

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f apps/api/requirements.txt ]; then pip install -r apps/api/requirements.txt; fi

      - name: Syntax & bytecode check
        run: python -m compileall -q python_core apps phases tests_phases

      - name: Run pytest on Python Core & Phase 11-20
        run: |
          python -m pytest \
            python_core/tests \
            --ignore=python_core/tests/test_continual_learning.py \
            --ignore=python_core/tests/test_p1_benchmark.py \
            tests_phases \
            -v

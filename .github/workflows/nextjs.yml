name: Next.js

on:
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - ".github/workflows/nextjs.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - ".github/workflows/nextjs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextjs-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Next.js Web Build & Checks (apps/web)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/web

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install apps/web dependencies
        run: npm install --no-audit --no-fund

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest unit tests
        run: npm run test

      - name: Build Next.js production bundle
        run: npm run build

name: ZYRQUEN Data Quality Audit

on:
  push:
    branches: ["main"]
    paths:
      - "python_core/**"
      - ".github/workflows/data-quality.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "python_core/**"
      - ".github/workflows/data-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-tool-validation:
    name: Dataset Leakage & Fixture Isolation Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONPATH: ${{ github.workspace }}/python_core

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate leakage & continual curriculum checks
        run: |
          python -m py_compile python_core/continual_learning.py python_core/tests/benchmark_fixtures.py
          python - <<'PY'
          from tests.benchmark_fixtures import verify_fixture_isolation

          iso = verify_fixture_isolation()
          assert iso["isolated"], f"Train/eval overlap detected: {iso['overlaps']}"
          print("Fixture isolation verified:", iso)
          PY

      - name: Check private datasets are not committed
        run: |
          if git ls-files --error-unmatch data/ >/dev/null 2>&1; then
            echo "::error::Runtime data directory must not be tracked by Git"
            exit 1
          fi
          echo "Private dataset tracking check passed."

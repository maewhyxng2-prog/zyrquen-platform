name: ZYRQUEN Capability Development

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  capability-tests:
    name: Native Intelligence Capability Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PYTHONPATH: ${{ github.workspace }}/python_core

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python capability modules
        run: python -m compileall -q python_core

      - name: Test Continual Learning & Curriculum Synthesis
        run: python -m unittest python_core/tests/test_continual_learning.py -v

      - name: Test P1-P2 Native Capabilities & Anti-Fabrication Benchmark
        run: python -m unittest python_core/tests/test_p1_benchmark.py -v

  capability-readiness:
    name: Capability Modules & Governance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify native capability modules
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              "python_core/zyrquen_core.py",
              "python_core/capability_verifier.py",
              "python_core/continual_learning.py",
              "python_core/native_neural.py",
              "python_core/native_tokenizer.py",
              "python_core/dag_executor.py",
          ]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit(f"Missing native capability modules: {missing}")
          print("All native capability modules verified:", len(required))
          PY

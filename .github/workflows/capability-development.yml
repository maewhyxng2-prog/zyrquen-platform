name: ZYRQUEN Capability Development

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-tests:
    name: Native Intelligence Capability Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHON_DOTENV_DISABLED: "1"
      ZYRQUEN_ENV: unit_test
      DATABASE_URL: sqlite:///./test.db
      JWT_SECRET_KEY: capability-test-secret
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt
          python -m pip install numpy torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test Native Model
        run: rc=0; python -m pytest -v apps/core/native --tb=short || rc=$?; if [ $rc -eq 0 ] || [ $rc -eq 5 ]; then echo "pytest rc=$rc OK"; else exit $rc; fi
      - name: Test Native Evaluation
        run: rc=0; python -m pytest -v apps/core/native/evaluation --tb=short || rc=$?; if [ $rc -eq 0 ] || [ $rc -eq 5 ]; then echo "pytest rc=$rc OK"; else exit $rc; fi
      - name: Test Autonomous Training Loop
        run: rc=0; python -m pytest -v apps/core/workflow/test_autonomous_training_loop.py --tb=short || rc=$?; if [ $rc -eq 0 ] || [ $rc -eq 5 ]; then echo "pytest rc=$rc OK"; else exit $rc; fi
      - name: Test Workflow Governance
        run: rc=0; python -m pytest -v apps/core/workflow --tb=short || rc=$?; if [ $rc -eq 0 ] || [ $rc -eq 5 ]; then echo "pytest rc=$rc OK"; else exit $rc; fi
      - name: Compile capability components
        run: python -m compileall -q apps/core/native apps/core/workflow

  capability-readiness:
    name: Training Hook and Approval Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check training hook implementation
        run: |
          python - <<'PY2'
          from pathlib import Path
          path = Path("apps/core/workflow/handlers/groups.py")
          if not path.is_file():
              raise SystemExit("BLOCKED: workflow handlers not found")
          source = path.read_text(encoding="utf-8")
          if "training_hook_not_implemented" in source:
              print("BLOCKED: real training hook is not implemented")
              raise SystemExit(0)
          print("REVIEW_REQUIRED: training hook marker not found.")
          PY2
      - name: Report execution restrictions
        run: |
          echo "Training execution: NOT RUN"
          echo "Paid GPU: PROHIBITED"
          echo "Tier-2 approval: REQUIRED"
          echo "Checkpoint promotion: NOT RUN"
          echo "Deployment: NOT RUN"


name: ZYRQUEN API Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:///./test.db
      # main.py imports apps.core (repo root) and routers/database (apps/api)
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        run: python -m pytest -v

      - name: Install PyTorch (CPU) for native model tests
        working-directory: .
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run native model, training and infrastructure tests
        working-directory: .
        run: python -m pytest -v apps/core/native apps/core/training_infrastructure apps/core/training

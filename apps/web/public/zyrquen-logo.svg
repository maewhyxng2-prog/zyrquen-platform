      <stop offset="1" stop-color="#25a3c4"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c5fbff"/><stop offset=".28" stop-color="#56d7e8"/><stop offset=".62" stop-color="#1685b8"/><stop offset="1" stop-color="#b6f8ff"/>
    </linearGradient>
    <linearGradient id="glass" x1=".12" y1="0" x2=".88" y2="1">
      <stop offset="0" stop-color="#183d59"/><stop offset=".48" stop-color="#10263e"/><stop offset="1" stop-color="#07111d"/>
    </linearGradient>

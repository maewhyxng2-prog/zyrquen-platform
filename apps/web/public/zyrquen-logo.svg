      .pulse { transform-box: fill-box; transform-origin: center; animation: soft-pulse 4.8s ease-in-out infinite; }
      .trace { stroke-dasharray: 14 150; stroke-dashoffset: 164; animation: trace-run 6.4s linear infinite; }
      .wordmark { fill: url(#wordmark); font: 750 32px/1 "Inter", "Segoe UI", Arial, sans-serif; letter-spacing: 4px; }
      @keyframes orbit-turn { to { transform: rotate(360deg); } }
      @keyframes core-turn { to { transform: rotate(-360deg); } }
      @keyframes soft-pulse { 0%, 100% { opacity: .25; transform: scale(.96); } 50% { opacity: .62; transform: scale(1.035); } }
      @keyframes trace-run { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .orbit, .core, .pulse, .trace { animation: none !important; }
        .pulse { opacity: .4; }
        .trace { stroke-dasharray: none; stroke-dashoffset: 0; }

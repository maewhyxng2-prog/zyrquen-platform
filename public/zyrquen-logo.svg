<svg width="64" height="64" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="zyrq-svg-border" x1="2" y1="2" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0.82" />
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.65" />
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.82" />
    </linearGradient>
    <linearGradient id="zyrq-svg-stroke" x1="9" y1="9" x2="27" y2="27" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" />
      <stop offset="0.52" stop-color="#3B82F6" />
      <stop offset="1" stop-color="#A78BFA" />
    </linearGradient>
    <linearGradient id="zyrq-svg-pulse" x1="10" y1="11" x2="26" y2="25" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CFFAFE" />
      <stop offset="0.5" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#DDD6FE" />
    </linearGradient>
    <radialGradient id="zyrq-svg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.42" />
      <stop offset="55%" stop-color="#3B82F6" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0B1325" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="zyrq-svg-orbit" x1="5" y1="5" x2="31" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.72" />
      <stop offset="0.5" stop-color="#3B82F6" stop-opacity="0.08" />
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.72" />
    </linearGradient>
    <linearGradient id="zyrq-svg-orbit-rev" x1="31" y1="5" x2="5" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity="0.5" />
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.05" />
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.5" />
    </linearGradient>
    <filter id="zyrq-svg-bloom" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="1.25" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <path id="zyrq-svg-zpath" d="M11 11.5H25L11 24.5H25" />
  </defs>

  <!-- Minimalist Slate Cognitive Frame -->
  <rect x="1.5" y="1.5" width="33" height="33" rx="10" fill="#0B1325" stroke="url(#zyrq-svg-border)" stroke-width="1.4" />

  <!-- Central Core Breathing Glow -->
  <circle cx="18" cy="18" r="12.5" fill="url(#zyrq-svg-glow)">
    <animate attributeName="opacity" values="0.32;0.82;0.32" dur="3.6s" repeatCount="indefinite" />
    <animate attributeName="r" values="10.8;13.2;10.8" dur="3.6s" repeatCount="indefinite" />
  </circle>

  <!-- Geometric Cognitive Hexagon & Synaptic Spokes -->
  <polygon
    points="18,6.5 27.9,12.2 27.9,23.8 18,29.5 8.1,23.8 8.1,12.2"
    stroke="#38BDF8"
    stroke-opacity="0.22"
    stroke-width="0.9"
    stroke-linejoin="round"
  />
  <g stroke="#22D3EE" stroke-opacity="0.24" stroke-width="0.85" stroke-linecap="round">
    <line x1="18" y1="6.5" x2="18" y2="14.5" />
    <line x1="18" y1="21.5" x2="18" y2="29.5" />
    <line x1="8.1" y1="12.2" x2="14.6" y2="16" />
    <line x1="21.4" y1="20" x2="27.9" y2="23.8" />
  </g>

  <!-- Dual Counter-Rotating Orbital Rings around Cognitive Core -->
  <circle cx="18" cy="18" r="13.6" stroke="url(#zyrq-svg-orbit)" stroke-width="0.95" stroke-dasharray="16 20 6 36" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="11s" repeatCount="indefinite" />
  </circle>
  <circle cx="18" cy="18" r="10.6" stroke="url(#zyrq-svg-orbit-rev)" stroke-width="0.75" stroke-dasharray="10 24 4 26" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="360 18 18" to="0 18 18" dur="16s" repeatCount="indefinite" />
  </circle>

  <!-- Central Nucleus (Breathe) -->
  <circle cx="18" cy="18" r="2.1" fill="#22D3EE" fill-opacity="0.26" stroke="#38BDF8" stroke-opacity="0.65" stroke-width="0.8">
    <animate attributeName="r" values="1.8;2.6;1.8" dur="3.6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;0.95;0.5" dur="3.6s" repeatCount="indefinite" />
  </circle>

  <!-- Primary Geometric Z-Cognitive Path -->
  <path d="M11 11.5H25L11 24.5H25" stroke="url(#zyrq-svg-stroke)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.2" filter="url(#zyrq-svg-bloom)" />
  <path d="M11 11.5H25L11 24.5H25" stroke="url(#zyrq-svg-stroke)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Luminous Neural Signal Trace + Orb -->
  <path d="M11 11.5H25L11 24.5H25" pathLength="60" stroke="url(#zyrq-svg-pulse)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 46" filter="url(#zyrq-svg-bloom)">
    <animate attributeName="stroke-dashoffset" from="60" to="0" dur="2.8s" repeatCount="indefinite" />
  </path>
  <circle r="1.35" fill="#ECFEFF" filter="url(#zyrq-svg-bloom)">
    <animateMotion dur="2.8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#zyrq-svg-zpath" />
    </animateMotion>
    <animate attributeName="opacity" values="0.25;1;1;0.25" dur="2.8s" repeatCount="indefinite" />
  </circle>

  <!-- Synchronized Terminal Node Pulses -->
  <circle cx="25" cy="11.5" r="2.0" stroke="#22D3EE" stroke-width="0.95">
    <animate attributeName="r" values="1.9;3.9;1.9" dur="2.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.82;0.08;0.82" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="11" cy="24.5" r="2.0" stroke="#A78BFA" stroke-width="0.95">
    <animate attributeName="r" values="1.9;3.9;1.9" dur="2.8s" begin="1.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.82;0.08;0.82" dur="2.8s" begin="1.4s" repeatCount="indefinite" />
  </circle>

  <circle cx="25" cy="11.5" r="1.95" fill="#22D3EE" />
  <circle cx="25" cy="11.5" r="0.8" fill="#ECFEFF" />
  <circle cx="11" cy="24.5" r="1.95" fill="#8B5CF6" />
  <circle cx="11" cy="24.5" r="0.8" fill="#EDE9FE" />
  <circle cx="18" cy="6.5" r="1.0" fill="#38BDF8" fill-opacity="0.75" />
  <circle cx="18" cy="29.5" r="1.0" fill="#A78BFA" fill-opacity="0.75" />
</svg>
